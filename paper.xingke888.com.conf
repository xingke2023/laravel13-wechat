server {
    listen 80;
    listen 443 ssl;
    server_name paper.xingke888.com;

    # SSL termination is handled by Cloudflare; this origin cert is for
    # internal/edge probes. The xingke888.com leaf cert is reused.
    ssl_certificate /etc/letsencrypt/live/xingke888.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xingke888.com/privkey.pem;

    access_log /var/log/nginx/paper.xingke888.com.access.log;
    error_log  /var/log/nginx/paper.xingke888.com.error.log;

    client_max_body_size 32m;

    # AI streaming endpoint: disable buffering so SSE chunks flow live
    location = /api/ai/chat-stream {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # Laravel API → backend on 127.0.0.1:8081
    location /api {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Filament admin panel & assets → backend on 127.0.0.1:8081
    location ~ ^/(admin|livewire|css/filament|js/filament|fonts/filament|images/filament|storage) {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js frontend → 127.0.0.1:3111
    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
